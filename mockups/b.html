<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup B · Focus</title>
<style>
:root { --bg:#fbfaf7; --text:#16161a; --muted:#7a7870; --line:#e7e4dc; --accent:#c2410c; --no:#d1495b; --yes:#2a9d6f; --card:#fff; }
[data-theme="dark"] { --bg:#111110; --text:#f1efe9; --muted:#8e8b82; --line:#2b2a27; --accent:#fb923c; --card:#1a1a18; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); }
body { font:17px/1.6 system-ui, sans-serif; display:flex; flex-direction:column; max-width:32rem; margin:auto; }
.line { height:3px; background:var(--line); } .line i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
.bar { display:flex; justify-content:space-between; align-items:center; padding:.7rem 1.2rem; font-size:.8rem; color:var(--muted); }
.bar .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:var(--yes); margin-right:.35rem; }
.bar button { background:none; border:0; color:var(--muted); font-size:1.1rem; }
.stage { position:relative; flex:1; padding:1rem 1.4rem; overflow:hidden; touch-action:pan-y; }
.paper { transition:transform .3s, opacity .3s; }
.kicker { font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
.q { font-family:Georgia, "Times New Roman", serif; font-size:1.55rem; line-height:1.35; margin:.6rem 0 1.4rem; }
.q strong { font-weight:700; background:linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 28%, transparent) 0); }
.answer { border-top:1px solid var(--line); padding-top:1rem; animation:rise .35s ease; }
@keyframes rise { from { opacity:0; transform:translateY(.6rem); } }
.answer strong { color:var(--accent); }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
td, th { padding:.3rem .2rem; border-bottom:1px solid var(--line); text-align:left; }
th { color:var(--muted); font-weight:500; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; }
.points { margin:1rem 0 0; padding:0; list-style:none; counter-reset:p; }
.points li { counter-increment:p; padding:.4rem 0 .4rem 2rem; position:relative; border-bottom:1px dashed var(--line); }
.points li::before { content:counter(p); position:absolute; left:0; top:.45rem; width:1.4rem; height:1.4rem; border-radius:50%; border:1.5px solid var(--muted); font-size:.75rem; display:grid; place-items:center; color:var(--muted); }
.points li.on::before { content:"✓"; background:var(--yes); border-color:var(--yes); color:#fff; }
.edge { position:absolute; top:40%; font-weight:700; font-size:1.1rem; padding:.4rem .8rem; border-radius:.5rem; opacity:0; transition:opacity .1s; pointer-events:none; }
.edge.l { left:.6rem; color:#fff; background:var(--no); } .edge.r { right:.6rem; color:#fff; background:var(--yes); }
.foot { padding:.6rem 1.2rem 1.4rem; }
.tip { text-align:center; color:var(--muted); font-size:.82rem; margin-bottom:.7rem; }
.pair { display:flex; gap:.7rem; }
.pair button, .stack button, .full { flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:.9rem; padding:.9rem; font:600 1rem system-ui; }
.pair .no { border-color:var(--no); color:var(--no); } .pair .yes { border-color:var(--yes); color:var(--yes); }
.stack { display:grid; gap:.5rem; }
.stack button { display:flex; justify-content:space-between; align-items:center; text-align:left; }
.stack button span { font-weight:400; color:var(--muted); font-size:.85rem; }
.full { width:100%; background:var(--text); color:var(--bg); border-color:var(--text); }
.opts { list-style:none; padding:0; margin:0; }
.opts li { display:flex; gap:1rem; padding:.85rem .2rem; border-bottom:1px solid var(--line); font-size:1.05rem; cursor:pointer; }
.opts li b { font-family:Georgia, serif; color:var(--muted); }
.opts li.right { color:var(--yes); } .opts li.right b { color:var(--yes); }
.opts li.wrong { color:var(--no); text-decoration:line-through; }
.trap { color:var(--no); font-size:.88rem; margin:.4rem 0; }
textarea { width:100%; min-height:5rem; border:0; border-bottom:2px solid var(--accent); background:transparent; color:var(--text); font:1.05rem Georgia, serif; padding:.4rem 0; outline:none; }
.end h1 { font-family:Georgia, serif; font-weight:400; font-size:2.2rem; margin:2rem 0 .4rem; }
.facts { display:flex; gap:1.8rem; margin:1.4rem 0; }
.facts b { display:block; font-family:Georgia, serif; font-size:2rem; font-weight:400; }
.facts span { color:var(--muted); font-size:.82rem; }
.sheet { position:fixed; inset:0; background:color-mix(in srgb, var(--bg) 92%, transparent); display:grid; place-items:center; }
select { font:1rem system-ui; padding:.6rem; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:.6rem; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="line"><i id="bar"></i></div>
<div class="bar"><span><span class="dot"></span><span id="sync">saved</span> · <span id="count"></span></span><span>8 for AI · <button id="gear" aria-label="Settings">◐</button></span></div>

<div class="stage" id="stage">
  <div class="edge l" id="el">Didn't know</div>
  <div class="edge r" id="er">Knew it</div>
  <div class="paper" id="paper">
    <div class="kicker" id="kicker"></div>
    <div class="q" id="front"></div>
    <ul class="opts" id="opts" hidden></ul>
    <div class="answer" id="answer" hidden>
      <div id="back"></div>
      <ul class="points" id="points"></ul>
    </div>
  </div>
</div>

<div class="foot" id="foot"></div>

<div class="sheet" id="sheet" hidden>
  <div><p>Theme</p><select id="theme"><option value="system">Follow the phone</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <p><button class="full" id="close">Done</button></p></div>
</div>

<script type="module">
import { CARDS, SESSION, rich, list, swipe, theme } from "./common.js";
const $ = (id) => document.getElementById(id);
theme($("theme"));
$("gear").onclick = () => $("sheet").hidden = false;
$("close").onclick = () => $("sheet").hidden = true;
let i = 0, revealed = false; const s = { ...SESSION };
const foot = (html) => { $("foot").innerHTML = html; };

function show() {
  $("bar").style.width = `${(s.done / s.due) * 100}%`;
  $("count").textContent = `${s.due - s.done} left`;
  const c = CARDS[i]; if (!c) return end();
  revealed = false;
  $("paper").style.transform = ""; $("paper").style.opacity = 1;
  $("kicker").textContent = c.kind === "choice" ? `${c.topic} · choose` : c.topic;
  rich($("front"), c.front);
  $("answer").hidden = true; $("opts").hidden = c.kind !== "choice";
  if (c.kind === "choice") return choice(c);
  rich($("back"), c.back); list($("points"), c.points);
  [...$("points").children].forEach((li) => li.onclick = () => li.classList.toggle("on"));
  foot('<div class="tip">Answer in your head, then swipe: ← didn\'t know · knew it →</div><button class="full" id="rev">Show the answer</button>');
  $("rev").onclick = reveal;
}
function reveal() {
  revealed = true; $("answer").hidden = false;
  foot('<div class="tip">Each numbered point said, in any words? Tap the ones you had.</div><div class="pair"><button class="no" id="n">Didn\'t know</button><button class="yes" id="y">Knew it</button></div>');
  $("n").onclick = () => next(1); $("y").onclick = how;
}
function how() {
  if (!revealed) { revealed = true; $("answer").hidden = false; }
  foot('<div class="tip">How did it come?</div><div class="stack">' +
    '<button id="e">Instantly <span>~2 s, would bet on it</span></button>' +
    '<button id="g">After a moment <span>a few seconds, then sure</span></button>' +
    '<button id="h">With effort <span>hesitated or rebuilt it</span></button></div>');
  $("e").onclick = () => next(4); $("g").onclick = () => next(3); $("h").onclick = () => next(2);
}
function choice(c) {
  $("opts").replaceChildren(...c.options.map((o, n) => {
    const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = "abcd"[n];
    li.append(b, document.createTextNode(o.text)); li.onclick = () => pick(c, n); return li;
  }));
  foot('<div class="tip">Tap an option</div>');
}
function pick(c, n) {
  const lis = [...$("opts").children]; lis.forEach((li) => li.onclick = null);
  const r = c.options.findIndex((o) => o.right); lis[r].classList.add("right");
  if (n !== r) {
    lis[n].classList.add("wrong");
    const t = document.createElement("div"); t.className = "trap"; t.textContent = "That's the trap: " + c.options[n].trap; lis[n].after(t);
    foot('<div class="tip" id="w"></div><button class="full" id="go">Continue</button>'); $("w").textContent = c.why;
    $("go").onclick = () => next(1);
  } else {
    foot('<textarea placeholder="Why? In a sentence or two — AI grades it later"></textarea><p></p><button class="full" id="go">Save</button>');
    $("go").onclick = () => next(3);
  }
}
function next(r) {
  s.done++; if (r === 1) s.again++;
  $("sync").textContent = "saving…"; setTimeout(() => $("sync").textContent = "saved", 700);
  $("paper").style.transform = `translateX(${r === 1 ? -40 : 40}px)`; $("paper").style.opacity = 0;
  setTimeout(() => { i++; show(); }, 250);
}
function end() {
  $("bar").style.width = "100%";
  $("stage").innerHTML = `<div class="end"><div class="kicker">Session</div><h1>That's all for now.</h1>
    <div class="facts"><div><b>${s.done}</b><span>answered</span></div><div><b>${s.again}</b><span>come back soon</span></div><div><b>${s.aiWaiting}</b><span>wait for AI</span></div></div>
    <p style="color:var(--muted)">The open questions need the grader: explain, trace, cases.</p></div>`;
  foot('<button class="full">Continue with Claude</button>');
}
swipe($("stage"), {
  move: (dx) => { if (CARDS[i]?.kind !== "card") return; $("paper").style.transform = dx ? `translateX(${dx / 3}px)` : "";
    $("el").style.opacity = dx < -20 ? Math.min(1, -dx / 120) : 0; $("er").style.opacity = dx > 20 ? Math.min(1, dx / 120) : 0; },
  left: () => { if (CARDS[i]?.kind === "card") next(1); },
  right: () => { if (CARDS[i]?.kind === "card") how(); },
});
show();
</script>
</body>
</html>
