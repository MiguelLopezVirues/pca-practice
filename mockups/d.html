<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0072B2">
<title>Mockup D · Cards with sections</title>
<style>
/* Okabe-Ito colours (safe for red/green colour blindness), always with an icon or label as second cue */
:root { --bg:#f3f5fa; --card:#fff; --text:#1b1f2e; --muted:#687087; --line:#e2e6ef; --soft:#eef1f7;
  --blue:#0072B2; --sky:#56B4E9; --green:#009E73; --orange:#E69F00; --verm:#D55E00; --purple:#CC79A7; --yellow:#F0E442;
  --shadow:0 8px 24px rgba(25,35,80,.10); }
[data-theme="dark"] { --bg:#0e1118; --card:#181c27; --text:#eaedf5; --muted:#99a0b5; --line:#2a2f3d; --soft:#212634; --shadow:0 8px 24px rgba(0,0,0,.45); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { max-width:30rem; margin:auto; }
main { padding:calc(env(safe-area-inset-top) + .8rem) 1rem 6.5rem; }
h1 { font-size:1.6rem; margin:.2rem 0 1rem; } h2 { font-size:1rem; margin:1.4rem 0 .6rem; color:var(--muted); font-weight:600; }
.tabs { position:fixed; bottom:0; left:0; right:0; max-width:30rem; margin:auto; display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--card); box-shadow:0 -6px 20px rgba(0,0,0,.08); border-radius:1.2rem 1.2rem 0 0; padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom)); }
.tabs button { background:none; border:0; color:var(--muted); font:600 .7rem system-ui; display:grid; justify-items:center; gap:.15rem; }
.tabs svg { width:1.5rem; height:1.5rem; }
.tabs button.on { color:var(--blue); }
body.practising .tabs { display:none; } body.practising main { padding-bottom:1rem; }
/* today */
.hero { display:flex; gap:1rem; align-items:center; background:var(--card); border-radius:1.4rem; padding:1.1rem; box-shadow:var(--shadow); }
.ring { width:6.5rem; height:6.5rem; flex:none; }
.ring text { font:700 1.4rem system-ui; fill:var(--text); } .ring .sub { font:500 .6rem system-ui; fill:var(--muted); }
.hero p { margin:.1rem 0; color:var(--muted); font-size:.9rem; } .hero b { color:var(--text); font-size:1.1rem; }
.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin-top:.8rem; }
.tile { background:var(--card); border-radius:1.1rem; padding:.8rem; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.tile .ic { width:2rem; height:2rem; border-radius:.7rem; display:grid; place-items:center; color:#fff; font-size:1rem; margin-bottom:.4rem; }
.tile b { display:block; font-size:1.5rem; line-height:1.1; } .tile span { font-size:.75rem; color:var(--muted); }
.go { width:100%; margin-top:1rem; border:0; border-radius:1.1rem; padding:1.05rem; font:700 1.1rem system-ui; color:#fff; background:var(--blue); box-shadow:0 10px 22px rgba(0,114,178,.35); display:flex; justify-content:center; gap:.6rem; align-items:center; }
.aicard { display:flex; gap:.8rem; align-items:center; background:var(--card); border-radius:1.1rem; padding:.9rem; margin-top:.8rem; box-shadow:var(--shadow); border-left:.35rem solid var(--purple); }
.aicard .ic { width:2.4rem; height:2.4rem; border-radius:.8rem; background:var(--purple); color:#fff; display:grid; place-items:center; font-weight:800; }
.aicard > div:not(.ic) { flex:1; font-size:.9rem; } .aicard b { display:block; font-size:1rem; }
.aicard button { border:0; background:var(--soft); color:var(--text); border-radius:.8rem; padding:.55rem .8rem; font-weight:600; }
.week { display:flex; justify-content:space-between; background:var(--card); border-radius:1.1rem; padding:.8rem 1rem; box-shadow:var(--shadow); }
.day { display:grid; justify-items:center; gap:.3rem; font-size:.7rem; color:var(--muted); }
.day i { width:1.6rem; height:1.6rem; border-radius:50%; background:var(--soft); display:grid; place-items:center; font-style:normal; color:#fff; font-size:.75rem; }
.day i.on { background:var(--green); } .day.today i { outline:2px solid var(--blue); outline-offset:2px; }
/* practice (A) */
.top { display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem; }
.icon { background:none; border:0; font-size:1.3rem; color:var(--muted); padding:.2rem; }
.progress { flex:1; height:.5rem; background:var(--line); border-radius:1rem; overflow:hidden; }
.progress i { display:block; height:100%; width:0; background:var(--blue); border-radius:1rem; transition:width .4s; }
.chip { font-size:.75rem; padding:.25rem .6rem; border-radius:1rem; background:var(--card); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.stage { perspective:1200px; }
.card { position:relative; display:grid; background:var(--card); border-radius:1.4rem; box-shadow:var(--shadow); padding:1.4rem 1.3rem; min-height:21rem;
  transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .25s; transform-style:preserve-3d; touch-action:pan-y; }
.card .face { grid-area:1/1; backface-visibility:hidden; } .card .front { padding-bottom:2.5rem; } .card .back { transform:rotateY(180deg); }
.card.flipped { transform:rotateY(180deg); }
.kind { display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--blue); margin-bottom:.8rem; }
.q { font-size:1.22rem; line-height:1.45; } .q strong, .a strong, .pts strong { color:var(--blue); font-weight:650; }
.hint { position:absolute; bottom:1rem; left:0; right:0; text-align:center; color:var(--muted); font-size:.82rem; }
table { border-collapse:collapse; width:100%; font-size:.92rem; margin:.4rem 0 1rem; }
th, td { text-align:left; padding:.35rem .4rem; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:600; font-size:.75rem; text-transform:uppercase; }
.pts h4 { margin:.6rem 0 .3rem; font-size:.85rem; color:var(--muted); font-weight:600; }
.pts ul { list-style:none; padding:0; margin:0; }
.pts li { display:flex; gap:.6rem; align-items:flex-start; padding:.45rem .2rem; cursor:pointer; }
.pts li::before { content:""; flex:none; width:1.3rem; height:1.3rem; margin-top:.1rem; border:2px solid var(--line); border-radius:.4rem; display:grid; place-items:center; color:#fff; font-size:.8rem; }
.pts li.on::before { content:"✓"; background:var(--blue); border-color:var(--blue); }
.actions { position:sticky; bottom:0; padding:1.4rem 0 calc(.6rem + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 1.2rem); }
.ask { text-align:center; color:var(--muted); font-size:.9rem; margin:0 0 .6rem; }
.row { display:grid; gap:.6rem; } .row.two { grid-template-columns:1fr 1fr; } .row.three { grid-template-columns:repeat(3,1fr); }
.btn { border:0; border-radius:1rem; padding:.95rem .5rem; font:700 1rem system-ui; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.12); }
.btn small { display:block; font-weight:400; font-size:.72rem; opacity:.95; }
.no { background:var(--verm); } .yes { background:var(--blue); } .easy { background:var(--sky); color:#062033; } .good { background:var(--blue); } .hard { background:var(--orange); color:#2a1a00; }
.primary { background:var(--blue); width:100%; } .ghost { background:none; color:var(--muted); box-shadow:none; width:100%; font-weight:500; }
.suggest { outline:3px solid var(--text); outline-offset:2px; }
.options { display:grid; gap:.6rem; margin-top:1rem; }
.opt { text-align:left; border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:1rem; padding:.85rem 1rem; font:500 1rem system-ui; display:flex; gap:.8rem; align-items:center; }
.opt b { flex:none; width:1.8rem; height:1.8rem; border-radius:50%; display:grid; place-items:center; background:var(--soft); font-size:.85rem; }
.opt.right { border-color:var(--blue); } .opt.right b { background:var(--blue); color:#fff; }
.opt.wrong { border-color:var(--verm); border-style:dashed; } .opt.wrong b { background:var(--verm); color:#fff; }
.trap { font-size:.85rem; color:var(--verm); margin:.1rem 0 0 2.6rem; }
textarea { width:100%; min-height:5.5rem; border:2px solid var(--line); border-radius:1rem; padding:.8rem; font:1rem system-ui; background:var(--card); color:var(--text); }
/* queue */
.seg { display:flex; background:var(--soft); border-radius:.9rem; padding:.25rem; gap:.2rem; }
.seg button { flex:1; border:0; background:none; color:var(--muted); padding:.5rem .3rem; border-radius:.7rem; font:600 .85rem system-ui; }
.seg button.on { background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.08); }
.filters { display:flex; gap:.45rem; overflow-x:auto; padding:.8rem 0 .2rem; scrollbar-width:none; }
.filters button { flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:1.2rem; padding:.4rem .8rem; font:600 .82rem system-ui; display:flex; gap:.35rem; align-items:center; }
.filters button.on { border-color:var(--blue); background:var(--blue); color:#fff; }
.filters i, .pill i { font-style:normal; }
.group { margin-top:1rem; } .group h3 { display:flex; justify-content:space-between; font-size:.9rem; margin:0 0 .5rem; }
.group h3 span { color:var(--muted); font-weight:500; }
.item { display:flex; gap:.7rem; align-items:center; background:var(--card); border-radius:1rem; padding:.7rem .8rem; margin-bottom:.45rem; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.item .ty { width:2.2rem; height:2.2rem; flex:none; border-radius:.75rem; display:grid; place-items:center; font-size:1rem; background:var(--soft); }
.item p { flex:1; margin:0; font-size:.9rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pill { flex:none; font-size:.72rem; font-weight:700; padding:.2rem .5rem; border-radius:.6rem; color:#fff; display:flex; gap:.25rem; }
.pill.due { background:var(--orange); color:#2a1a00; } .pill.new { background:var(--sky); color:#062033; } .pill.learn { background:var(--purple); color:#2b0a1f; }
.pill.later { background:var(--soft); color:var(--muted); } .pill.ai { background:none; border:1.5px solid var(--blue); color:var(--blue); }
/* progress */
.topic { background:var(--card); border-radius:1.1rem; padding:.9rem; margin-bottom:.6rem; box-shadow:var(--shadow); }
.topic h4 { margin:0 0 .5rem; display:flex; justify-content:space-between; font-size:.95rem; } .topic h4 span { color:var(--muted); font-weight:500; font-size:.82rem; }
.stack { display:flex; height:.75rem; border-radius:.6rem; overflow:hidden; background:var(--soft); }
.stack i { display:block; height:100%; } .stack .k { background:var(--blue); } .stack .l { background:var(--sky); background-image:repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.35) 4px 7px); } .stack .n { background:var(--line); }
.legend { display:flex; gap:.9rem; font-size:.75rem; color:var(--muted); margin-top:.6rem; }
.legend i { display:inline-block; width:.7rem; height:.7rem; border-radius:.2rem; margin-right:.3rem; vertical-align:-1px; }
.bars { display:flex; align-items:flex-end; gap:.5rem; height:7rem; background:var(--card); border-radius:1.1rem; padding:1rem; box-shadow:var(--shadow); }
.bars div { flex:1; display:grid; gap:.3rem; justify-items:center; font-size:.7rem; color:var(--muted); }
.bars i { width:100%; border-radius:.4rem .4rem .2rem .2rem; background:var(--blue); }
.gauges { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.gauge { background:var(--card); border-radius:1.1rem; padding:.9rem; box-shadow:var(--shadow); text-align:center; }
.gauge b { display:block; font-size:1.6rem; } .gauge span { font-size:.78rem; color:var(--muted); }
/* sheet */
.veil { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s; }
.veil.open { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; max-width:30rem; margin:auto; background:var(--card); border-radius:1.4rem 1.4rem 0 0; padding:.6rem 1.2rem 1.4rem; max-height:85vh; overflow:auto; transform:translateY(105%); transition:transform .3s; }
.sheet.open { transform:none; } .grab { width:2.6rem; height:.3rem; border-radius:1rem; background:var(--line); margin:.2rem auto .8rem; }
.setting { display:flex; justify-content:space-between; align-items:center; background:var(--card); border-radius:1rem; padding:.9rem 1rem; margin-bottom:.5rem; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.setting .seg { width:13rem; }
.toggle { width:3rem; height:1.7rem; border-radius:1rem; background:var(--blue); position:relative; }
.toggle::after { content:""; position:absolute; right:.2rem; top:.2rem; width:1.3rem; height:1.3rem; border-radius:50%; background:#fff; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="5" rx="1.5"/><rect x="4" y="11" width="16" height="5" rx="1.5"/><path d="M6 20h12"/></svg>Cards</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script type="module">
import { CARDS, rich, list, swipe, theme } from "./common.js";
const $ = (id) => document.getElementById(id);
const main = $("main");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
theme();

const TYPES = { card: ["▢", "Self-graded"], choice: ["◉", "Choice + why"], open: ["✎", "Open (AI)"] };
const STATUS = { due: ["●", "Due now"], new: ["✦", "New"], learn: ["↻", "Learning"], later: ["", "in 3 d"], ai: ["✎", "AI"] };
const QUEUE = [
  { t: "How networks move data", k: "card", s: "due", f: "A web page reaches your browser: name the layers from the bottom up" },
  { t: "How networks move data", k: "card", s: "learn", f: "Which is the client, which the server, and what decides it?" },
  { t: "How networks move data", k: "card", s: "new", f: "What does a LAN cover, what does a WAN link, what is an internet?" },
  { t: "How networks move data", k: "open", s: "ai", f: "Explain why a change inside one layer does not affect the others" },
  { t: "How networks move data", k: "open", s: "ai", f: "Trace how headers are added going down the stack" },
  { t: "How networks move data", k: "card", s: "later", f: "TCP or UDP: how does each deliver, and what does UDP give up?" },
  { t: "Devices and services", k: "choice", s: "new", f: "Two apps on the same server: which label sends them to different backends?" },
  { t: "Devices and services", k: "card", s: "new", f: "What is each router a packet passes through called?" },
  { t: "Devices and services", k: "open", s: "ai", f: "Why can't a switch reach a host on another network?" },
  { t: "Reliability and security", k: "card", s: "later", f: "Inside IPsec, which protocol encrypts and which only checks?" },
  { t: "Reliability and security", k: "choice", s: "new", f: "Which protection covers the whole path between two offices?" },
];
const s = { due: 12, done: 0, again: 0, ai: 8 };

function tab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  document.body.classList.remove("practising");
  ({ today, queue, progress, settings })[name]();
}
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => tab(b.dataset.tab));

function ring(done, total) {
  const r = 42, c = 2 * Math.PI * r, f = total ? done / total : 0;
  return `<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--blue)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="52" text-anchor="middle">${total - done}</text><text class="sub" x="50" y="66" text-anchor="middle">left today</text></svg>`;
}

function today() {
  main.innerHTML = `<h1>Today</h1>
    <div class="hero">${ring(s.done, s.due)}<div><b>${s.done ? "Keep going" : "Ready when you are"}</b>
      <p>About ${Math.max(1, Math.round((s.due - s.done) * 0.4))} min of cards</p><p>34 days to the exam</p></div></div>
    <div class="tiles">
      <div class="tile"><div class="ic" style="background:var(--orange);color:#2a1a00">●</div><b>4</b><span>due now</span></div>
      <div class="tile"><div class="ic" style="background:var(--sky);color:#062033">✦</div><b>13</b><span>new</span></div>
      <div class="tile"><div class="ic" style="background:var(--purple);color:#2b0a1f">✎</div><b>${s.ai}</b><span>for AI</span></div>
    </div>
    <button class="go" id="go">▶ Start practice</button>
    <div class="aicard"><div class="ic">AI</div><div><b>${s.ai} open questions</b>Explain, trace and case questions need the grader</div><button>Open Claude</button></div>
    <h2>This week</h2>
    <div class="week">${["M", "T", "W", "T", "F", "S", "S"].map((d, n) => `<div class="day${n === 0 ? " today" : ""}"><i class="${n < 1 ? "on" : ""}">${n < 1 ? "✓" : ""}</i>${d}</div>`).join("")}</div>`;
  $("go").onclick = () => { i = 0; practise(); };
}

let group = "topic", filter = "all";
function queue() {
  main.innerHTML = `<h1>Cards</h1><div class="seg" id="seg"><button data-g="topic">Topic</button><button data-g="k">Type</button><button data-g="s">Status</button></div>
    <div class="filters" id="filters"></div><div id="groups"></div>`;
  [...$("seg").children].forEach((b) => { b.classList.toggle("on", b.dataset.g === group); b.onclick = () => { group = b.dataset.g; queue(); }; });
  const F = [["all", "All", ""], ["due", "Due now", "●"], ["new", "New", "✦"], ["learn", "Learning", "↻"], ["ai", "AI", "✎"], ["later", "Later", ""]];
  $("filters").replaceChildren(...F.map(([k, label, ic]) => {
    const b = el("button", filter === k ? "on" : ""); if (ic) b.append(el("i", "", ic)); b.append(label);
    const n = QUEUE.filter((q) => k === "all" || q.s === k).length; b.append(el("span", "", ` ${n}`));
    b.onclick = () => { filter = k; queue(); }; return b;
  }));
  const shown = QUEUE.filter((q) => filter === "all" || q.s === filter);
  const keyOf = (q) => group === "topic" ? q.t : group === "k" ? TYPES[q.k][1] : STATUS[q.s][1];
  const groups = {};
  shown.forEach((q) => (groups[keyOf(q)] ??= []).push(q));
  $("groups").replaceChildren(...Object.entries(groups).map(([name, items]) => {
    const g = el("div", "group"); const h = el("h3", "", name); h.append(el("span", "", `${items.length}`)); g.append(h);
    items.forEach((q) => {
      const row = el("div", "item"); row.append(el("div", "ty", TYPES[q.k][0]), el("p", "", q.f));
      const pill = el("span", `pill ${q.s}`); if (STATUS[q.s][0]) pill.append(el("i", "", STATUS[q.s][0])); pill.append(STATUS[q.s][1]);
      row.append(pill); row.onclick = () => preview(q); g.append(row);
    });
    return g;
  }));
}

function preview(q) {
  const b = $("sheetBody"); b.replaceChildren();
  const k = el("div", "kind", `${TYPES[q.k][0]} ${TYPES[q.k][1]} · ${q.t}`); const f = el("div", "q");
  rich(f, q.f);
  const st = el("span", `pill ${q.s}`, STATUS[q.s][1]); st.style.display = "inline-flex";
  b.append(k, f, el("p"), st, el("p", "ask", "Preview only: the schedule does not change. In the real page the answer and key points show here too."));
  const close = el("button", "btn ghost", "Close"); close.onclick = sheet; b.append(close);
  sheet(true);
}
function sheet(open) { $("veil").classList.toggle("open", !!open); $("sheet").classList.toggle("open", !!open); }
$("veil").onclick = () => sheet(false);

function progress() {
  const T = [["How networks move data", 2, 3, 8, "13 cards"], ["Devices and services", 0, 0, 15, "locked: read it first"], ["Reliability and security", 0, 0, 19, "locked"]];
  main.innerHTML = `<h1>Progress</h1><div class="gauges"><div class="gauge"><b>${s.done + 3}</b><span>answered this week</span></div>
    <div class="gauge"><b>—</b><span>remembered on time (needs a week of data)</span></div></div>
    <h2>Topics</h2>${T.map(([n, k, l, nw, note]) => { const t = k + l + nw; return `<div class="topic"><h4>${n}<span>${note}</span></h4>
      <div class="stack"><i class="k" style="width:${(k / t) * 100}%"></i><i class="l" style="width:${(l / t) * 100}%"></i><i class="n" style="width:${(nw / t) * 100}%"></i></div></div>`; }).join("")}
    <div class="legend"><span><i style="background:var(--blue)"></i>Known</span><span><i style="background:var(--sky)"></i>Learning (striped)</span><span><i style="background:var(--line)"></i>Not started</span></div>
    <h2>Answers per day</h2><div class="bars">${[3, 0, 0, 0, 0, 0, s.done].map((v, n) => `<div><i style="height:${v * 10 + 4}px;opacity:${v ? 1 : .25}"></i>${"MTWTFSS"[n]}</div>`).join("")}</div>`;
}

function settings() {
  main.innerHTML = `<h1>Settings</h1>
    <div class="setting">Theme<div class="seg" id="th"><button data-v="system">Phone</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
    <div class="setting">Swipe to rate<div class="toggle"></div></div>
    <div class="setting">GitHub token<span class="chip">✓ works</span></div>
    <div class="setting">Saved<span class="chip">✓ just now</span></div>`;
  const cur = localStorage.getItem("mock-theme") || "system";
  [...$("th").children].forEach((b) => { b.classList.toggle("on", b.dataset.v === cur);
    b.onclick = () => { localStorage.setItem("mock-theme", b.dataset.v); theme(); settings(); }; });
}

// ---------- practice: mockup A's card ----------
let i = 0, flipped = false;
function practise() {
  document.body.classList.add("practising");
  main.innerHTML = `<div class="top"><button class="icon" id="x">✕</button><div class="progress"><i id="bar"></i></div><span class="chip" id="sync">✓ Saved</span></div>
    <div class="stage"><div class="card" id="card"><div class="face front"><span class="kind" id="kind"></span><div class="q" id="front"></div>
    <div class="options" id="options" hidden></div><div class="hint" id="hint">Tap to see the answer · swipe ← didn't know, → knew it</div></div>
    <div class="face back"><span class="kind">Answer</span><div class="a" id="back"></div><div class="pts"><h4>You knew it if you said each of these, in any words. Tap the ones you had:</h4><ul id="points"></ul></div></div></div></div>
    <div class="actions" id="actions"></div>`;
  $("x").onclick = () => tab("today");
  $("card").onclick = (e) => { if (CARDS[i]?.kind === "card" && !e.target.closest("li")) flip(); };
  swipe($("card"), {
    move: (dx) => { if (CARDS[i]?.kind === "card" && !flipped) $("card").style.transform = dx ? `translateX(${dx}px) rotate(${dx / 25}deg)` : ""; },
    left: () => { if (CARDS[i]?.kind === "card") { flip(); next(1); } },
    right: () => { if (CARDS[i]?.kind === "card") { flip(); step2(); } },
  });
  show();
}
function show() {
  $("bar").style.width = `${(s.done / s.due) * 100}%`;
  const c = CARDS[i]; if (!c) return end();
  flipped = false; const card = $("card");
  card.classList.remove("flipped"); card.style.transition = "none"; card.style.transform = ""; void card.offsetWidth; card.style.transition = "";
  $("kind").textContent = `${TYPES[c.kind][0]} ${TYPES[c.kind][1]} · ${c.topic}`;
  rich($("front"), c.front);
  $("options").hidden = c.kind !== "choice"; $("hint").hidden = c.kind === "choice";
  $("actions").replaceChildren();
  if (c.kind === "choice") return choice(c);
  rich($("back"), c.back); list($("points"), c.points);
  [...$("points").children].forEach((li) => { const t = el("span"); t.append(...li.childNodes); li.append(t); li.onclick = () => { li.classList.toggle("on"); suggest(); }; });
  const b = el("button", "btn primary", "Show answer"); b.onclick = flip; $("actions").append(b);
}
function flip() { if (flipped) return; flipped = true; $("card").classList.add("flipped"); step1(); }
function step1() {
  $("actions").innerHTML = '<p class="ask">Did you know it?</p><div class="row two"><button class="btn no" id="no">✕ No<small>a point missing or wrong</small></button><button class="btn yes" id="yes">✓ Yes<small>every key point</small></button></div>';
  $("no").onclick = () => next(1); $("yes").onclick = step2; suggest();
}
function suggest() {
  const lis = [...$("points").children]; if (!$("no") || !lis.length) return;
  const all = lis.every((li) => li.classList.contains("on")), any = lis.some((li) => li.classList.contains("on"));
  $("yes").classList.toggle("suggest", all); $("no").classList.toggle("suggest", any && !all);
}
function step2() {
  $("actions").innerHTML = '<p class="ask">How did it come?</p><div class="row three"><button class="btn easy" id="e">⚡ Instantly<small>~2 s, sure</small></button><button class="btn good" id="g">◷ A moment<small>a few seconds</small></button><button class="btn hard" id="h">▲ With effort<small>hesitated</small></button></div><button class="btn ghost" id="b1">← back</button>';
  $("e").onclick = () => next(4); $("g").onclick = () => next(3); $("h").onclick = () => next(2); $("b1").onclick = step1;
}
function choice(c) {
  $("options").replaceChildren(...c.options.map((o, n) => { const b = el("button", "opt"); b.append(el("b", "", "ABCD"[n]), o.text); b.onclick = () => pick(c, n, b); return b; }));
}
function pick(c, n, b) {
  const opts = [...$("options").children]; opts.forEach((x) => x.disabled = true);
  const r = c.options.findIndex((x) => x.right); opts[r].classList.add("right"); opts[r].querySelector("b").textContent = "✓";
  if (n !== r) {
    b.classList.add("wrong"); b.querySelector("b").textContent = "✕"; b.after(el("p", "trap", "Trap: " + c.options[n].trap));
    $("actions").replaceChildren(el("p", "ask", c.why)); const go = el("button", "btn primary", "Continue"); go.onclick = () => next(1); $("actions").append(go);
  } else {
    $("actions").innerHTML = '<p class="ask">Right. Why? One or two sentences, graded by AI at your next Claude session</p><textarea placeholder="Because…"></textarea><p></p><button class="btn primary" id="go">Save reason</button>';
    $("go").onclick = () => next(3);
  }
}
function next(r) {
  s.done++; if (r === 1) s.again++;
  $("sync").textContent = "↻ Saving…"; setTimeout(() => { if ($("sync")) $("sync").textContent = "✓ Saved"; }, 700);
  $("card").style.transform = `translateX(${r === 1 ? -120 : 120}%) rotate(${r === 1 ? -8 : 8}deg)`;
  setTimeout(() => { i++; show(); }, 260);
}
function end() {
  document.body.classList.remove("practising");
  main.innerHTML = `<div style="text-align:center"><svg viewBox="0 0 100 100" style="width:6rem;margin:1.5rem auto .5rem;display:block"><circle cx="50" cy="50" r="46" fill="var(--blue)"/><path d="M30 52l13 13 27-29" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Done for now</h1></div><div class="tiles"><div class="tile"><b>${s.done}</b><span>answered</span></div><div class="tile"><b>${s.again}</b><span>back soon</span></div><div class="tile"><b>✓</b><span>saved</span></div></div>
    <div class="aicard"><div class="ic">AI</div><div><b>${s.ai} open questions</b>wait for an AI session</div><button>Open Claude</button></div>
    <button class="go" id="home">Back to Today</button>`;
  $("home").onclick = () => tab("today");
}
today();
</script>
</body>
</html>
